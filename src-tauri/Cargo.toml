[package]
name = "yysls-auto-guqin"
version = "0.1.6"
description = "燕云琴笺 · 自由演奏工作台"
authors = ["MIGO-OvO", "Kukisama"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
default-run = "yysls-auto-guqin"

[lib]
name = "guqin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Media", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[dev-dependencies]
minisign-verify = "0.3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "unwind"
